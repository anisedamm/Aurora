name: CI

# The repo demonstrates its own discipline on itself: a pass/fail gate (the test
# suite) on every commit and PR, plus an integrity check that the readings ledger
# is intact and its published manifest still commits to the same chain head.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run the test suite
        run: pytest -q

  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so git: anchors can be resolved

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ledger integrity self-check
        run: |
          python -m interpretation verify     # the readings chain is untampered
          python -m interpretation signal      # signal = integrity x direction(truth) == 1
          python -m interpretation status      # one screen (exit 0 iff signal == 1)
